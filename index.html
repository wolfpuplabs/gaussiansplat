<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D KSplat Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #0d0d11; font-family: sans-serif; }
        #canvas-container { width: 100%; height: 100%; }
        #loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff; font-size: 16px; font-weight: bold;
            background: rgba(0,0,0,0.8); padding: 15px 25px; border-radius: 12px;
            pointer-events: none; text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
    <!-- Library pendukung khusus file .ksplat -->
    <script src="https://cdn.jsdelivr.net/npm/@m33/gaussian-splats-3d@latest/build/gaussian-splats-3d.umd.min.js"></script>
</head>
<body>

    <div id="loading">Memuat Model .ksplat...</div>
    <div id="canvas-container"></div>

    <script>
        // MASUKKAN URL PUBLIC FILE .KSPLAT DARI VERCEL BLOB ANDA DI SINI
        const ksplatUrl = 'https://dwxc7bnvmg7ycxoi.public.blob.vercel-storage.com/lohort.compressed.ksplat';

        const viewer = new GaussianSplats3D.Viewer({
            'rootElement': document.getElementById('canvas-container'),
            'cameraUp': [0, -1, 0],
            'initialCameraPosition': [0, 1.5, 3],
            'initialCameraLookAt': [0, 0, 0],
            'halfPrecisionCovariancesOnGPU': true // Efisiensi memori GPU di iPad
        });

        // Load file .ksplat secara otomatis
        viewer.addSplatScene(ksplatUrl, {
            'format': GaussianSplats3D.SceneFormat.KSPLAT,
            'showLoadingUI': false
        }).then(() => {
            viewer.start();
            document.getElementById('loading').style.display = 'none';
        }).catch((err) => {
            console.error('Error loading .ksplat:', err);
            document.getElementById('loading').innerText = 'Gagal memuat file .ksplat!';
        });
    </script>
</body>
</html>
