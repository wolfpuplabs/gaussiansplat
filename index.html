<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Splat Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #0d0d11; font-family: sans-serif; }
        #loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff; font-size: 16px; font-weight: bold;
            background: rgba(0,0,0,0.85); padding: 16px 28px; border-radius: 12px;
            pointer-events: none; text-align: center;
            border: 1px solid rgba(255,255,255,0.15);
            z-index: 100;
        }
    </style>
    <!-- Import PlayCanvas Splat Component resmi -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/@playcanvas/web-components@latest/dist/pcsv.js"></script>
</head>
<body>

    <div id="loading">Memuat Model 3D...</div>

    <!-- Web Component resmi PlayCanvas untuk Splatting -->
    <pc-splat id="splat-viewer" src="https://dwxc7bnvmg7ycxoi.public.blob.vercel-storage.com/lohort.compressed.ksplat"></pc-splat>

    <script>
        const viewer = document.getElementById('splat-viewer');
        
        // Hilangkan overlay loading ketika model selesai di-render
        viewer.addEventListener('load', () => {
            document.getElementById('loading').style.display = 'none';
        });

        viewer.addEventListener('error', (err) => {
            console.error('Error loading splat:', err);
            document.getElementById('loading').innerText = 'Gagal memuat file! Periksa URL atau koneksi.';
        });
    </script>
</body>
</html>
